# ╔══════════════════════════════════════════════════════════════════╗
# ║  frps.toml  —  FRP SERVER  (runs on your VPS)                   ║
# ╚══════════════════════════════════════════════════════════════════╝
#
# Install frp on the VPS:
#   wget https://github.com/fatedier/frp/releases/download/v0.61.0/frp_0.61.0_linux_amd64.tar.gz
#   tar -xzf frp_0.61.0_linux_amd64.tar.gz
#   cd frp_0.61.0_linux_amd64
#   cp frps /usr/local/bin/frps
#
# Run as systemd service (see frp/frps.service) or:
#   frps -c /etc/frp/frps.toml

# ── Bind ──────────────────────────────────────────────────────────────────────
bindAddr = "0.0.0.0"
bindPort = 7000           # frpc connects to this port

# ── Auth ──────────────────────────────────────────────────────────────────────
# CHANGE THIS — must match frpc.toml
auth.method = "token"
auth.token  = "CHANGE_ME_STRONG_SECRET"

# ── Dashboard (optional, remove if not needed) ────────────────────────────────
# webServer.addr = "127.0.0.1"
# webServer.port = 7500
# webServer.user = "admin"
# webServer.password = "admin"

# ── Logging ───────────────────────────────────────────────────────────────────
log.to    = "/var/log/frps.log"
log.level = "info"
